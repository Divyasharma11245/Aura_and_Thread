services:
  mongodb:
    image: mongo:7
    container_name: aura-thread-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aura-thread-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aura}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in your environment}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - ./auth-service/.env
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    env_file:
      - ./product-service/.env
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy

  payment-notification-service:
    build:
      context: ./payment-notification-service
      dockerfile: Dockerfile
    env_file:
      - ./payment-notification-service/.env
    ports:
      - "5004:5004"
    depends_on:
      rabbitmq:
        condition: service_healthy

  email-worker:
    build:
      context: ./payment-notification-service
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    env_file:
      - ./payment-notification-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb_data:
  rabbitmq_data:
